name: Precision diagnostics

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Diagnostic family to run
        required: true
        default: all
        type: choice
        options:
          - all
          - eom
          - pbc-tdhf
          - pbc-hse06
          - pbc-hse03
          - ucasscf
          - sa4-newton
          - sgx
          - sgx-pbe0
          - sgx-hse06
          - sgx-wb97x
          - tddft
          - analyze
          - split-eom
          - split-ucasscf
          - split-sa4-newton
          - split-tddft
          - split-analyze
          - split-pbc-hse03
          - split-pbc-hse06
          - split-pbc-tdhf-replay
          - split-pbc-tdhf-fixture-bank
          - split-pbc-tdhf-native-replay
          - split-sgx-pbe0
          - split-sgx-hse06
          - split-sgx-hse06-control
          - split-sgx-wb97x
      profiles:
        description: Split profiles to run
        required: true
        default: all
        type: choice
        options:
          - all
          - omp1-blas1
          - omp4-blas1
          - omp1-blas4
          - omp4-blas4
          - omp1-blas1,omp4-blas1
          - omp1-blas4,omp4-blas4
      repeats:
        description: Maximum outer repetitions per diagnostic family
        required: true
        default: "200"
        type: string
      platform:
        description: Platform family
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows
      libxc_revision:
        description: LibXC commit for diagnostics
        required: true
        default: f4439479220beff707fc071e14345a205c885521
        type: string
      libxc_wpbeh_revision:
        description: Optional LibXC commit supplying only generated WPBEH C source
        required: false
        default: ""
        type: string

jobs:
  paired-linux:
    if: inputs.platform == 'all' || inputs.platform == 'ubuntu'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux dependencies
        env:
          LIBXC_REVISION: ${{ inputs.libxc_revision }}
          LIBXC_WPBEH_REVISION: ${{ inputs.libxc_wpbeh_revision }}
        run: |
          .github/workflows/ci_linux/deps_apt.sh
          .github/workflows/ci_linux/python_deps.sh
          .github/workflows/ci_linux/build_pyscf.sh
      - name: Run paired diagnostics
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          ulimit -s 20000
          python .github/workflows/run_paired_precision_diagnostics.py \
            --script .github/workflows/precision_experiments.py \
            --experiment "${{ inputs.experiment }}" \
            --profiles "${{ inputs.profiles }}" \
            --repeats "${{ inputs.repeats }}" \
            --output "tmp/precision-thread-paired/${{ inputs.experiment }}"
      - name: Capture runtime environment
        if: always()
        run: |
          python .github/workflows/collect_precision_environment.py \
            --snapshot-dir "tmp/precision-thread-paired/${{ inputs.experiment }}/environment/runtime"
      - name: Publish paired summaries
        if: always()
        run: |
          for summary in tmp/precision-thread-paired/${{ inputs.experiment }}/*/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload Linux paired artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-thread-paired-${{ inputs.experiment }}-ubuntu-py${{ matrix.python-version }}
          path: tmp/precision-thread-paired/${{ inputs.experiment }}
          if-no-files-found: error

  paired-macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install macOS dependencies
        env:
          LIBXC_REVISION: ${{ inputs.libxc_revision }}
        run: |
          .github/workflows/ci_macos/deps_apt.sh
          .github/workflows/ci_macos/python_deps.sh
          .github/workflows/ci_macos/build_pyscf.sh
      - name: Run paired diagnostics
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          python .github/workflows/run_paired_precision_diagnostics.py \
            --script .github/workflows/precision_experiments.py \
            --experiment "${{ inputs.experiment }}" \
            --profiles "${{ inputs.profiles }}" \
            --repeats "${{ inputs.repeats }}" \
            --output "tmp/precision-thread-paired/${{ inputs.experiment }}"
      - name: Capture runtime environment
        if: always()
        run: |
          python .github/workflows/collect_precision_environment.py \
            --snapshot-dir "tmp/precision-thread-paired/${{ inputs.experiment }}/environment/runtime"
      - name: Publish paired summaries
        if: always()
        run: |
          for summary in tmp/precision-thread-paired/${{ inputs.experiment }}/*/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload macOS paired artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-thread-paired-${{ inputs.experiment }}-macos-py${{ matrix.python-version }}
          path: tmp/precision-thread-paired/${{ inputs.experiment }}
          if-no-files-found: error

  paired-windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          auto-update-conda: false
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas
      - name: Build installed wheel and run paired diagnostics
        env:
          LIBXC_REVISION: ${{ inputs.libxc_revision }}
          RUNTIME_DLL_DIR: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: |
          $tag = "${{ matrix.python-version }}".Replace(".", "")
          .\.github\workflows\run_windows_precision_diagnostics.ps1 `
            -BuildEnvName "pyscf-paired-build-$tag" `
            -TestEnvName "pyscf-paired-test-$tag" `
            -PythonVersion "${{ matrix.python-version }}" `
            -Experiment "${{ inputs.experiment }}" `
            -Profiles "${{ inputs.profiles }}" `
            -Repeats ([int]"${{ inputs.repeats }}") `
            -RuntimeDllDir $env:RUNTIME_DLL_DIR `
            -Paired
      - name: Publish paired summaries
        if: always()
        run: |
          Get-ChildItem "tmp/precision-thread-paired/${{ inputs.experiment }}/*/summary.md" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
      - name: Upload Windows paired artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-thread-paired-${{ inputs.experiment }}-windows-py${{ matrix.python-version }}
          path: |
            tmp/precision-thread-paired/${{ inputs.experiment }}
            .github/workflows/ci_windows/build-logs/**
          if-no-files-found: error
