name: Precision triage

on:
  workflow_dispatch:
    inputs:
      run-linux-macos:
        description: Run the Linux/macOS source-build matrix
        required: false
        type: boolean
        default: true
      run-windows:
        description: Run the Windows installed-wheel matrix
        required: false
        type: boolean
        default: true

jobs:
  precision:
    if: ${{ inputs['run-linux-macos'] }}
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install platform dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ci_os=linux
          else
            ci_os=macos
          fi
          ".github/workflows/ci_${ci_os}/deps_apt.sh"
          ".github/workflows/ci_${ci_os}/python_deps.sh"
          ".github/workflows/ci_${ci_os}/build_pyscf.sh"
      - name: Capture build environment
        run: |
          python .github/workflows/collect_precision_environment.py --snapshot-dir tmp/precision-results/environment/build
          printf 'phase=build\nOMP_NUM_THREADS=%s\nOPENBLAS_NUM_THREADS=%s\nMKL_NUM_THREADS=%s\n' \
            "$OMP_NUM_THREADS" "$OPENBLAS_NUM_THREADS" "$MKL_NUM_THREADS" \
            > tmp/precision-results/environment/build/runner-config.txt
      - name: Run precision tests
        run: bash ./.github/workflows/run_linux_precision_tests.sh
      - name: Publish precision summary
        if: always()
        run: |
          if [ -f tmp/precision-results/summary.md ]; then
            cat tmp/precision-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload precision logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tmp/precision-results
          if-no-files-found: warn

  precision-windows:
    if: ${{ inputs['run-windows'] }}
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            build-env: pyscf-win312
            test-env: pyscf-win312-test
          - python-version: "3.13"
            build-env: pyscf-win313
            test-env: pyscf-win313-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          auto-update-conda: false
      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas
      - name: Run installed-wheel precision tests
        run: >
          .\.github\workflows\run_windows_precision_tests.ps1
          -BuildEnvName ${{ matrix.build-env }}
          -TestEnvName ${{ matrix.test-env }}
          -PythonVersion ${{ matrix.python-version }}
          -RuntimeDllDir "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin"
      - name: Publish Windows precision summary
        if: always()
        run: |
          if (Test-Path tmp/precision-results/installed-wheel-report.md) {
            Get-Content tmp/precision-results/installed-wheel-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Upload Windows precision logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-windows-py${{ matrix.python-version }}
          path: |
            tmp/precision-results
            .github/workflows/ci_windows/build-logs/**
          if-no-files-found: warn
