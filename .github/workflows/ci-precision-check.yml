name: Precision check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  precision-unix:
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PRECISION_SHARD_COUNT: "3"
      PRECISION_SHARD_INDEX: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.12", "3.13"]
        shard: [0, 1, 2]
        exclude:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install platform dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ci_os=linux
          else
            ci_os=macos
          fi
          ".github/workflows/ci_${ci_os}/deps_apt.sh"
          ".github/workflows/ci_${ci_os}/python_deps.sh"
          ".github/workflows/ci_${ci_os}/build_pyscf.sh"
      - name: Capture build environment
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          python .github/workflows/collect_precision_environment.py --snapshot-dir tmp/precision-results/environment/build
          printf 'phase=build\nOMP_NUM_THREADS=%s\nOPENBLAS_NUM_THREADS=%s\nMKL_NUM_THREADS=%s\n' \
            "$OMP_NUM_THREADS" "$OPENBLAS_NUM_THREADS" "$MKL_NUM_THREADS" \
            > tmp/precision-results/environment/build/runner-config.txt
      - name: Run precision tests
        run: bash ./.github/workflows/run_unix_precision_tests.sh
      - name: Publish precision summary
        if: always()
        run: |
          if [ -f tmp/precision-results/summary.md ]; then
            cat tmp/precision-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload precision artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-${{ matrix.os }}-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: tmp/precision-results
          if-no-files-found: warn

  precision-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          auto-update-conda: false
      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas
      - name: Run installed-wheel precision tests
        run: |
          $tag = "${{ matrix.python-version }}".Replace(".", "")
          .\.github\workflows\run_windows_precision_tests.ps1 `
            -BuildEnvName "pyscf-win$tag" `
            -TestEnvName "pyscf-win$tag-test" `
            -PythonVersion "${{ matrix.python-version }}" `
            -ShardIndex ${{ matrix.shard }} `
            -ShardCount 3 `
            -RuntimeDllDir "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin"
      - name: Publish Windows precision summary
        if: always()
        run: |
          if (Test-Path tmp/precision-results/installed-wheel-report.md) {
            Get-Content tmp/precision-results/installed-wheel-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Upload Windows precision artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precision-windows-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: |
            tmp/precision-results
            .github/workflows/ci_windows/build-logs/**
          if-no-files-found: warn
