name: UCISD H4 failure capture

on:
  push:
    branches: [codex/investigate/ucisd-h4-20261107]

permissions:
  contents: read
  actions: read

concurrency:
  group: ucisd-h4-postmortem-${{ github.sha }}-windows-py31317
  cancel-in-progress: false

jobs:
  windows-capture:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.17'
      - name: Download the preserved failing wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 42281855545 --repo psiQAQ/pyscf
          --name ucisd-h4-c05e968f4bd46d3f3eb1d99d11ca7fe9967e5c63-windows-wheel
          --dir tmp/ucisd-h4-input
      - name: Capture the first failure in at most 100 fresh H4 processes
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'ucisd-h4-${{ github.run_id }}'
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $env:RUNNER_TEMP = $scratch
          $env:TMP = $scratch
          $env:TEMP = $scratch
          $env:PYSCF_TMPDIR = $scratch
          $env:PIP_CACHE_DIR = Join-Path $scratch 'pip-cache'
          python -B .github/workflows/ucisd_h4/capture_installed.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ucisd-h4-${{ github.sha }}-windows-py31317-postmortem-100
          if-no-files-found: error
          include-hidden-files: true
          path: tmp/ucisd-h4-capture/**
