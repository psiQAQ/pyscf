name: UCISD H4 Linux runtime follow-up

on:
  push:
    branches: [codex/validate/ucisd-h4-20261107]

permissions:
  contents: read
  actions: read

concurrency:
  group: ucisd-h4-fixed-${{ github.sha }}-linux-runtime
  cancel-in-progress: false

jobs:
  linux-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.17'
      - name: Install existing platform dependencies
        run: ./.github/workflows/ci_linux/deps_apt.sh
      - name: Download the already built candidate wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 42310399681 --repo psiQAQ/pyscf
          --name ucisd-h4-fixed-2a0082234202ba086bb6525184910a2b6e62b13c-linux-wheel
          --dir dist
      - name: Verify wheel and run installed-wheel CISD control
        run: |
          printf '%s  %s\n' '0d352ee75a7b607fdda1455f4a9ab3cb10b0208c3b472d4eb44bb5bfca8f0b7b' 'dist/pyscf-2.15.0-py3-none-linux_x86_64.whl' | sha256sum --check
          scratch="$RUNNER_TEMP/ucisd-h4-${{ github.sha }}-linux"
          mkdir -p "$scratch"
          export RUNNER_TEMP="$scratch" TMP="$scratch" TEMP="$scratch"
          export TMPDIR="$scratch" PYSCF_TMPDIR="$scratch" PIP_CACHE_DIR="$scratch/pip-cache"
          python -B .github/workflows/ucisd_h4/installed.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ucisd-h4-fixed-${{ github.sha }}-linux-py31317-2w
          if-no-files-found: error
          include-hidden-files: true
          path: tmp/ucisd-h4/**
