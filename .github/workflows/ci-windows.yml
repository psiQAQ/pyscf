name: Windows CI

on:
  workflow_dispatch:

jobs:
  windows-build-full:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ENV_NAME: pyscf-win313
      TEST_ENV_NAME: pyscf-win313-test
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          auto-update-conda: false

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas

      - name: Run Windows full validation
        run: >
          .\.github\workflows\run_ci_windows.ps1
          -Mode full
          -BuildEnvName $env:BUILD_ENV_NAME
          -TestEnvName $env:TEST_ENV_NAME
          -RuntimeDllDir "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin"

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-artifacts
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            tmp/precision-results/**
            .github/workflows/ci_windows/build-logs/**
            dist/*.whl
