name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ENV_NAME: pyscf-win313
      TEST_ENV_NAME: pyscf-win313-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          auto-update-conda: false

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas

      - name: Run Windows build
        run: >
          .\.github\workflows\run_ci_windows.ps1
          -Mode full
          -BuildEnvName $env:BUILD_ENV_NAME
          -TestEnvName $env:TEST_ENV_NAME
          -RuntimeDllDir "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin"

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifacts
          if-no-files-found: warn
          path: |
            dist/*.whl
            .github/workflows/ci_windows/build-logs/**
            .github/workflows/ci_windows/reports/**

  windows-build-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_ENV_NAME: pyscf-win313
      TEST_ENV_NAME: pyscf-win313-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          auto-update-conda: false

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openblas

      - name: Run Windows build check
        run: >
          .\.github\workflows\run_ci_windows.ps1
          -Mode check
          -BuildEnvName $env:BUILD_ENV_NAME
          -TestEnvName $env:TEST_ENV_NAME
          -RuntimeDllDir "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin"

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-check-artifacts
          if-no-files-found: warn
          path: |
            dist/*.whl
            .github/workflows/ci_windows/build-logs/**
            .github/workflows/ci_windows/reports/**
